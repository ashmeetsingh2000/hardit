<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardit singh & Jaipreet kaur</title>
    <meta name="description" content="">
    <meta name="theme-color" content="#ffffff">
    <!--
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <div id="loader" class="loader">

            <div class="top_triangle_box">
                <img src="assests/loadertop.webp" alt="">
            </div>

            <div class="bottom_triangle_box">
                <img src="assests/loaderbottom.webp" alt="">
            </div>

            <div class="left_triangle_box">
                <img src="assests/loaderleft.webp" alt="">
            </div>

            <div class="right_triangle_box">
                <img src="assests/loaderright.webp" alt="">
            </div>

            <button class="loader-stamp">
                <img src="assests/loadermiddle.webp"id="loaderStamp" alt="Open">
            </button>
            <button class="stamp-text"><span>Click to Open<span></button>

        </div>

        <div id="main_page_section"> 
            next to develop
        </div>

    </main>

    <script>
        const loader = document.getElementById("loader");
        const stamp = document.getElementById("loaderStamp");
        stamp.addEventListener("click", () => {
            loader.classList.add("open");
            setTimeout(() => {
                loader.classList.add("envelope-open");
            },2000);

            setTimeout(() => {
                loader.classList.add("finished");
            },4100);

        });
    </script>
</body>

</html>
