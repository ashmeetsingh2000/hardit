<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardit singh & Jaipreet kaur</title>
    <meta name="description" content="">
    <meta name="theme-color" content="#ffffff">
    <!--
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <div id="loader" class="loader">

            <div class="top_triangle_box">
                <img src="assests/loadertop.webp" alt="">
            </div>

            <div class="bottom_triangle_box">
                <img src="assests/loaderbottom.webp" alt="">
            </div>

            <div class="left_triangle_box">
                <img src="assests/loaderleft.webp" alt="">
            </div>

            <div class="right_triangle_box">
                <img src="assests/loaderright.webp" alt="">
            </div>

            <button class="loader-stamp">
                <img src="assests/loadermiddle.webp" id="loaderStamp" alt="Open">
            </button>
            <button class="stamp-text" id="loaderStampText"><span>Click to Open<span></button>

        </div>

        <div id="main_page_section">
            <section id="heroVideo">
                <div class="videoContainer">
                    <video class="hero-video" autoplay muted loop playsinline>
                        <source src="assests/VictorPaul.mp4" type="video/mp4">
                    </video>
                    <div class="overlaytext">
                        <span class="fade-in-up delay-200">Hardit Singh</span>
                        <span class="fade-in-up delay-200">&</span>
                        <span class="fade-in-up delay-200">Jaipreet kaur</span>
                    </div>
                </div>
                <div class="firstFlowerGarden">

                    <div class="flowerabsolute flower_no1">
                        <img class="scale-fade-in delay-200" src="assests/flowergarden1/flower1.webp" alt="">
                    </div>

                    <div class="flowerabsolute flower_no2">
                        <img class="scale-fade-in delay-800" src="assests/flowergarden1/flower2.webp" alt="">
                    </div>

                    <div class="flowerabsolute flower_no3">
                        <img class="scale-fade-in delay-200" src="assests/flowergarden1/flower2up.webp" alt="">
                    </div>

                    <div class="flowerabsolute flower_no4">
                        <img class="scale-fade-in delay-800" src="assests/flowergarden1/flower3.webp" alt="">
                    </div>

                    <div class="flowerabsolute flower_no5">
                        <img class="scale-fade-in delay-200" src="assests/flowergarden1/flower4.webp" alt="">
                    </div>

                    <div class="flowerabsolute flower_no6">
                        <img class="scale-fade-in delay-800" src="assests/flowergarden1/flower5.webp" alt="">
                    </div>

                    <div class="flowerabsolute flower_no7">
                        <img class="scale-fade-in delay-200" src="assests/flowergarden1/flower6.webp" alt="">
                    </div>

                </div>
                <div class="welcomeText">
                    <span class="fade-in-up delay-200">Dear Friends and Family</span>
                    <br>
                    <p class="fade-in-up delay-400">
                        As we get ready to say “I do,” we feel grateful for the wonderful people in our lives.
                    </p>
                    <br>
                    <p class="fade-in-up delay-600">
                        Your support means the world to us, and we would be honored to have you with us as we begin our
                        life together.
                    </p>
                </div>
            </section>
        </div>

    </main>

    <script src="assests/js/script.js"></script>
</body>

</html>
